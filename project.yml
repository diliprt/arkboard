name: Arkboard
options:
  bundleIdPrefix: studio.originark
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top
packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: "7.4.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
targets:
  Arkboard:
    type: application
    platform: macOS
    sources:
      - path: Sources/Arkboard
    dependencies:
      - package: GRDB
        product: GRDB
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: studio.originark.arkboard
        PRODUCT_NAME: Arkboard
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Arkboard
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSHumanReadableCopyright: Copyright © 2026 Origin Ark Studio. MIT License.
        INFOPLIST_KEY_LSMinimumSystemVersion: "14.0"
        CODE_SIGN_ENTITLEMENTS: Sources/Arkboard/Arkboard.entitlements
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: NO
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_STRICT_CONCURRENCY: minimal
    scheme:
      testTargets: []
